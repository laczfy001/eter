name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm git curl file \
            qt6-base-dev libqt6sql6-sqlite qt6-wayland libgl1-mesa-dev libxkbcommon-dev

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}

      - name: Build FFmpeg (audio decoders only, static)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/build_ffmpeg.sh

      - name: Build AppImage
        run: scripts/build_appimage.sh

      - name: Audio engine self-test
        run: |
          python3 - <<'PY'
          import math, struct, wave
          with wave.open('selftest.wav', 'wb') as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(48000)
              w.writeframes(b''.join(struct.pack('<hh', *(2 * [int(8000 * math.sin(i * 0.0576))])) for i in range(48000 * 5)))
          PY
          APPIMAGE_EXTRACT_AND_RUN=1 build/Eter-*-x86_64.AppImage --backend null --selftest selftest.wav

      - uses: actions/upload-artifact@v4
        with:
          name: Eter-AppImage
          path: build/Eter-*-x86_64.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Eter-*-x86_64.AppImage
          generate_release_notes: true
